<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raintown Syndicate</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at top,#29113d,#090910 55%,#050508);
  color:white;
  font-family:Arial,sans-serif;
}
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 7%;
  border-bottom:1px solid #ffffff20;
}
.logo{font-weight:900;letter-spacing:2px}
.logo span{color:#a855f7}
.buttons{display:flex;gap:12px}
.btn{
  display:inline-block;
  padding:12px 22px;
  color:white;
  text-decoration:none;
  border:1px solid #ffffff40;
  border-radius:8px;
  font-weight:bold;
  background:#ffffff09;
}
.btn.admin,.btn.join{
  background:linear-gradient(120deg,#9333ea,#4c1d95);
  border-color:#a855f7;
  box-shadow:0 0 20px #a855f755;
}
main{
  min-height:80vh;
  display:grid;
  place-items:center;
  text-align:center;
  padding:30px 20px;
}
.hero{max-width:750px}
.tag{
  color:#c084fc;
  letter-spacing:5px;
  font-size:13px;
  font-weight:bold;
}
h1{
  font-size:clamp(45px,9vw,85px);
  line-height:1;
  margin:22px 0;
}
h1 span{color:#a855f7}
p{color:#b8b5c4;line-height:1.7}
.hero p{max-width:550px;margin:0 auto 28px}
footer{
  text-align:center;
  color:#777;
  font-size:12px;
  padding:20px;
}
@media(max-width:500px){
  nav{padding:18px 5%}
  .logo{font-size:12px}
  .btn{padding:10px 13px;font-size:12px}
}
</style>
</head>

<body>

<nav>
  <div class="logo">RAINTOWN <span>SYNDICATE</span></div>

  <div class="buttons">
    <a href="member.html" class="btn">MEMBER</a>
    <a href="admin-login.html" class="btn admin">ADMIN</a>
  </div>
</nav>

<main>
  <section class="hero">
    <div class="tag">MOTORCYCLE RACING COMMUNITY</div>

    <h1>RIDE WITH<br><span>RAINTOWN.</span></h1>

    <p>
      One community. One passion.
      Built around the spirit of motorcycle racing.
    </p>

    <a href="member.html" class="btn join">BECOME A MEMBER</a>
  </section>
</main>

<footer>© 2026 RAINTOWN SYNDICATE</footer>

</body>
</html>
