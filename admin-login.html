<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Raintown</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(ellipse at top,#30113e,#07070b 65%);
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.box{
  width:min(440px,100%);
  padding:32px;
  background:#12121b;
  border:1px solid #a855f766;
  border-radius:16px;
}
h1{margin-top:25px}
p{color:#aaa;line-height:1.6}
a{color:#c084fc;text-decoration:none}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:8px;
  background:linear-gradient(100deg,#9333ea,#4c1d95);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
#status{color:#ff9bba}
</style>
</head>

<body>

<div class="box">

  <a href="index.html">← HOME</a>

  <h1>Admin Access</h1>

  <p>
    Authorized administrators only.
    Sign in using your approved Google account.
  </p>

  <button id="login">
    SIGN IN WITH GOOGLE
  </button>

  <p id="status"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
document.getElementById("login").onclick = async()=>{

  const {error} =
    await supabaseClient.auth.signInWithOAuth({
      provider:"google",
      options:{
        redirectTo:location.origin + "/admin.html"
      }
    });

  if(error){
    document.getElementById("status").textContent =
      error.message;
  }
};
</script>

</body>
</html>
